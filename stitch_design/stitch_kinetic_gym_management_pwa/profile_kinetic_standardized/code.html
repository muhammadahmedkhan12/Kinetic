<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>KINETIC | Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0B0C;
            color: #e1e2e4;
            -webkit-tap-highlight-color: transparent;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }

        .glass-card {
            background: #121214;
            border: 1px solid rgba(197, 168, 128, 0.15);
        }

        .kinetic-gold-text {
            color: #C5A880;
        }

        .kinetic-gold-bg {
            background-color: #C5A880;
        }

        .kinetic-gold-border {
            border-color: #C5A880;
        }

        .gold-glow {
            box-shadow: 0 0 15px rgba(197, 168, 128, 0.2);
        }

        .safe-pb {
            padding-bottom: env(safe-area-inset-bottom);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .nav-active {
            font-variation-settings: 'FILL' 1;
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#C5A880",
                        "on-primary": "#111415",
                        "background": "#0B0B0C",
                        "surface": "#121214",
                        "on-surface": "#e1e2e4",
                        "on-surface-variant": "#919094",
                        "outline": "#46464a",
                        "error": "#ffb4ab"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "24px",
                        "stack-sm": "4px",
                        "safe-margin": "20px",
                        "stack-md": "12px",
                        "gutter": "16px",
                        "base": "8px"
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-surface antialiased overflow-x-hidden pb-[110px]">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-[#0B0B0C]/80 border-b border-white/5 backdrop-blur-md h-16 flex justify-center items-center px-safe-margin">
<h1 class="text-xl font-bold kinetic-gold-text tracking-tighter uppercase font-heading">KINETIC</h1>
</header>
<main class="pt-24 px-safe-margin space-y-stack-lg">
<!-- Profile Header Section -->
<section class="flex flex-col items-center justify-center space-y-4">
<div class="relative">
<div class="w-32 h-32 rounded-full p-1 border-2 kinetic-gold-border overflow-hidden gold-glow">
<img alt="Ahmed Profile" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYkyncRCxbE2sARMsf6iRf1ydo82FjCKf7vaXRCKFb2XcUKm9w4P7CA2UFqFPd7T6GwG1jnBZYNLOrMbughx9-v5wpIlxfb0UN780bq82PvZxuFPDMj8H5XbKWiPT1lmYTHal9f6u_FnR_MGLEGeOvUh9Qg3Eo3x6nsNAEPQfrXhcSEunxPyuQNMI4OMuOdOZNQBtP1ca4g0d90e33Jok1FABS7TQXYcEwSwboPsbXQ4Ds7I0b5kN2"/>
</div>
<button class="absolute bottom-1 right-1 kinetic-gold-bg text-on-primary w-8 h-8 rounded-full flex items-center justify-center active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span>
</button>
</div>
<div class="text-center">
<h2 class="text-3xl font-bold text-on-surface font-heading">Ahmed</h2>
<p class="text-sm text-on-surface-variant">ahmed.elite@kinetic.com</p>
</div>
</section>
<!-- Personal Details Bento Grid -->
<section class="grid grid-cols-2 gap-gutter">
<div class="glass-card rounded-2xl p-4 flex flex-col space-y-1">
<span class="text-[10px] font-bold kinetic-gold-text uppercase tracking-widest font-heading">Age</span>
<span class="text-2xl font-bold text-on-surface">29</span>
</div>
<div class="glass-card rounded-2xl p-4 flex flex-col space-y-1">
<span class="text-[10px] font-bold kinetic-gold-text uppercase tracking-widest font-heading">Gender</span>
<span class="text-2xl font-bold text-on-surface">Male</span>
</div>
<div class="glass-card rounded-2xl p-4 flex flex-col space-y-1 col-span-2">
<span class="text-[10px] font-bold kinetic-gold-text uppercase tracking-widest font-heading">Phone Number</span>
<div class="flex justify-between items-center">
<span class="text-base font-medium text-on-surface">+971 50 123 4567</span>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<div class="glass-card rounded-2xl p-4 flex flex-col space-y-1 col-span-2">
<span class="text-[10px] font-bold kinetic-gold-text uppercase tracking-widest font-heading">Emergency Contact</span>
<div class="flex justify-between items-center">
<span class="text-base font-medium text-on-surface">Sara (Wife) • +971 50 987 6543</span>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</section>
<!-- Settings List Section -->
<section class="space-y-3">
<h3 class="text-[11px] font-bold text-on-surface-variant px-1 uppercase tracking-widest font-heading">Preferences</h3>
<div class="glass-card rounded-2xl overflow-hidden divide-y divide-white/5">
<!-- Account Settings -->
<button class="w-full flex items-center justify-between px-gutter py-5 hover:bg-white/5 active:bg-white/10 transition-colors">
<div class="flex items-center space-x-4">
<span class="material-symbols-outlined kinetic-gold-text" data-icon="manage_accounts">manage_accounts</span>
<span class="text-base font-medium text-on-surface">Account Settings</span>
</div>
<span class="material-symbols-outlined kinetic-gold-text" data-icon="chevron_right">chevron_right</span>
</button>
<!-- App Preferences -->
<button class="w-full flex items-center justify-between px-gutter py-5 hover:bg-white/5 active:bg-white/10 transition-colors">
<div class="flex items-center space-x-4">
<span class="material-symbols-outlined kinetic-gold-text" data-icon="install_mobile">install_mobile</span>
<span class="text-base font-medium text-on-surface">App Preferences</span>
</div>
<span class="material-symbols-outlined kinetic-gold-text" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Notifications -->
<button class="w-full flex items-center justify-between px-gutter py-5 hover:bg-white/5 active:bg-white/10 transition-colors">
<div class="flex items-center space-x-4">
<span class="material-symbols-outlined kinetic-gold-text" data-icon="notifications_active">notifications_active</span>
<span class="text-base font-medium text-on-surface">Notifications</span>
</div>
<span class="material-symbols-outlined kinetic-gold-text" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Logout -->
<button class="w-full flex items-center justify-between px-gutter py-5 hover:bg-white/5 active:bg-white/10 transition-colors">
<div class="flex items-center space-x-4">
<span class="material-symbols-outlined text-error" data-icon="logout">logout</span>
<span class="text-base font-medium text-error">Logout</span>
</div>
</button>
</div>
</section>
<!-- Subscription Badge -->
<div class="glass-card rounded-2xl p-5 border-l-4 kinetic-gold-border flex items-center justify-between">
<div class="flex items-center space-x-4">
<div class="bg-primary/10 p-2 rounded-lg">
<span class="material-symbols-outlined kinetic-gold-text" data-icon="workspace_premium" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
<div>
<h4 class="text-base font-bold text-on-surface font-heading">KINETIC ELITE</h4>
<p class="text-[12px] text-on-surface-variant">Membership expires in 242 days</p>
</div>
</div>
<span class="text-[11px] font-bold kinetic-gold-text underline decoration-2 underline-offset-4 font-heading">RENEW</span>
</div>
</main>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 w-full z-50 h-[84px] bg-[#0B0B0C]/90 border-t border-white/5 backdrop-blur-lg flex justify-around items-center px-2 pb-safe">
<button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant pt-1">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="text-[10px] font-medium mt-1">Home</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant pt-1">
<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
<span class="text-[10px] font-medium mt-1">Classes</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant pt-1">
<span class="material-symbols-outlined" data-icon="monitoring">monitoring</span>
<span class="text-[10px] font-medium mt-1">Weight</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant pt-1">
<span class="material-symbols-outlined" data-icon="smart_toy">smart_toy</span>
<span class="text-[10px] font-medium mt-1">AI Coach</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center text-on-surface-variant pt-1">
<span class="material-symbols-outlined" data-icon="payments">payments</span>
<span class="text-[10px] font-medium mt-1">Billing</span>
</button>
<button class="flex-1 flex flex-col items-center justify-center kinetic-gold-text border-t-2 kinetic-gold-border pt-1">
<span class="material-symbols-outlined nav-active" data-icon="person">person</span>
<span class="text-[10px] font-bold mt-1">Profile</span>
</button>
</nav>
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('opacity-70');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('opacity-70');
            });
        });
    </script>
</body></html>
