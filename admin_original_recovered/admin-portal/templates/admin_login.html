{% extends "admin_base.html" %}

{% block title %}Admin Login — KINETIC Gym{% endblock %}

{% block content %}
<section style="padding: 4rem 2rem;">
    <div class="form-container animate-on-scroll">
        <h1 class="form-container__title" style="font-size: 1.5rem;">ADMIN PORTAL</h1>
        <p class="form-container__subtitle">Authorized personnel only. Enter your admin credentials below.</p>

        {% if error %}
            <div class="form-alert form-alert-error">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="form-group">
                <label class="form-label" for="email">Admin Email</label>
                <input class="form-input" type="email" id="email" name="email" required placeholder="admin@kineticgym.com">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Admin Password</label>
                <input class="form-input" type="password" id="password" name="password" required placeholder="Enter admin password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Access Dashboard</button>
        </form>

        <p class="text-center text-muted" style="margin-top: 1.5rem; font-size: 0.85rem;">
            <a href="http://127.0.0.1:5000/" class="text-muted">&larr; Back to Home</a>
        </p>
    </div>
</section>
{% endblock %}
